spring.application.name=brd-review-agent
spring.ai.model.audio.speech=none

# openrouter config
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.model=openai/gpt-4o-mini
openrouter.api-key=${OPENROUTER_API_KEY:}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n

# time limit
server.tomcat.max-http-form-post-size=1MB
rate-limit.max-requests=10
rate-limit.window-millis=60000

# api authentication
api.security.enabled=true
api.security.key=${BRD_API_KEY:}

# local development database
spring.datasource.url=jdbc:h2:file:./data/brdreviewdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# jpa configuration for local development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# h2 console - local development only
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
